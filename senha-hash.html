<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 20px; }
    input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; font-size: 15px; }
    button { background: #3ecf8e; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:disabled { opacity: .5; cursor: wait; }
    .msg { margin-top: 12px; padding: 10px; border-radius: 6px; display: none; }
    .ok  { background: #e7f7ef; color: #1a7f4f; }
    .err { background: #fdecec; color: #c0392b; }
    .link-login { display: block; text-align: center; margin-top: 15px; color: #3ecf8e; text-decoration: none; font-size: 14px; }
    .link-login:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h2>Cadastro</h2>
  <form id="form">
    <input id="usuario" placeholder="Usuário" required autocomplete="username">
    <input id="senha" type="password" placeholder="Senha" required autocomplete="new-password">
    <textarea id="informacoes" placeholder="Informações (opcional)" rows="3"></textarea>
    <button type="submit" id="btn">Cadastrar</button>
  </form>

  <div id="msg" class="msg"></div>

  <a href="index.html" class="link-login">Já tem uma conta? Faça login</a>

  <script>
    // Mesmo hash do login — mantenha as duas funções iguais
    async function hashSenha(senha) {
      if (window.crypto && crypto.subtle) {
        const buf = new TextEncoder().encode(senha);
        const digest = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(digest))
          .map(b => b.toString(16).padStart(2, '0')).join('');
      }
      let h = 0;
      for (let i = 0; i < senha.length; i++) h = (h * 31 + senha.charCodeAt(i)) | 0;
      return 'simple_' + (h >>> 0).toString(16);
    }

    function uuid() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    const form = document.getElementById('form');
    const msg  = document.getElementById('msg');
    const btn  = document.getElementById('btn');

    function showMsg(text, ok) {
      msg.textContent = text;
      msg.className = 'msg ' + (ok ? 'ok' : 'err');
      msg.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.style.display = 'none';

      const usuario     = document.getElementById('usuario').value.trim();
      const senha       = document.getElementById('senha').value;
      const informacoes = document.getElementById('informacoes').value.trim();

      try {
        if (usuario.length < 3) { showMsg('Usuário muito curto (mín. 3 caracteres).', false); return; }
        if (senha.length   < 4) { showMsg('Senha muito curta (mín. 4 caracteres).',   false); return; }

        const usuarios = JSON.parse(localStorage.getItem('usuarios_registrados') || '[]');
        if (usuarios.some(u => u.usuario === usuario)) {
          showMsg('Este usuário já existe.', false);
          return;
        }

        const senha_hash = await hashSenha(senha);
        usuarios.push({
          id: uuid(),
          usuario,
          senha_hash,
          informacoes,
          criado_em: new Date().toISOString()
        });
        localStorage.setItem('usuarios_registrados', JSON.stringify(usuarios));

        showMsg('Cadastro realizado com sucesso! Redirecionando...', true);
        form.reset();
        setTimeout(() => window.location.href = 'index.html', 1500);
      } catch (err) {
        console.error(err);
        showMsg('Erro: ' + err.message, false);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
