<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 20px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; font-size: 15px; }
    button { background: #3ecf8e; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:disabled { opacity: .5; cursor: wait; }
    .msg { margin-top: 12px; padding: 10px; border-radius: 6px; display: none; }
    .ok  { background: #e7f7ef; color: #1a7f4f; }
    .err { background: #fdecec; color: #c0392b; }
    .link-cadastro { display: block; text-align: center; margin-top: 15px; color: #3ecf8e; text-decoration: none; font-size: 14px; }
    .link-cadastro:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h2>Login</h2>
  <form id="loginForm">
    <input id="usuario" placeholder="Usuário" required autocomplete="username">
    <input id="senha" type="password" placeholder="Senha" required autocomplete="current-password">
    <button type="submit" id="btn">Entrar</button>
  </form>
  <div id="msg" class="msg"></div>

  <a href="senha-hash.html" class="link-cadastro">Não tem uma conta? Cadastre-se</a>

  <script>
    // ---------- Helpers compartilhados ----------
    async function hashSenha(senha) {
      if (window.crypto && crypto.subtle) {
        const buf = new TextEncoder().encode(senha);
        const digest = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(digest))
          .map(b => b.toString(16).padStart(2, '0')).join('');
      }
      // Fallback (file:// sem HTTPS) — não é seguro, apenas para testes locais
      let h = 0;
      for (let i = 0; i < senha.length; i++) h = (h * 31 + senha.charCodeAt(i)) | 0;
      return 'simple_' + (h >>> 0).toString(16);
    }

    const form = document.getElementById('loginForm');
    const msg  = document.getElementById('msg');
    const btn  = document.getElementById('btn');

    function showMsg(text, ok) {
      msg.textContent = text;
      msg.className = 'msg ' + (ok ? 'ok' : 'err');
      msg.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.style.display = 'none';

      const usuario = document.getElementById('usuario').value.trim();
      const senha   = document.getElementById('senha').value;

      try {
        const hash = await hashSenha(senha);
        const usuarios = JSON.parse(localStorage.getItem('usuarios_registrados') || '[]');
        const user = usuarios.find(u => u.usuario === usuario && u.senha_hash === hash);

        if (!user) {
          showMsg('Usuário ou senha inválidos.', false);
          return;
        }

        localStorage.setItem('usuario_logado', JSON.stringify({
          id: user.id,
          nome: user.usuario
        }));

        showMsg('Login realizado! Redirecionando...', true);
        setTimeout(() => window.location.href = 'mapa.html', 1000);
      } catch (err) {
        console.error(err);
        showMsg('Erro: ' + err.message, false);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
